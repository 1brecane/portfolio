server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip (fallback if pre-compressed not available)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Serve pre-compressed gzip from vite-plugin-compression2
    gzip_static on;

    # Security headers — applied to locations that don't define their own add_header.
    # Nginx does NOT inherit these into child location blocks that set their own
    # add_header, so every such location below repeats the full set.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://hcaptcha.com https://*.hcaptcha.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://imgs.hcaptcha.com; frame-src https://hcaptcha.com https://*.hcaptcha.com; connect-src 'self' https://api.samueleruaro.com https://hcaptcha.com https://*.hcaptcha.com; font-src 'self'; object-src 'none'; base-uri 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Server-side Bearer injection for the homelab-api dashboard: the token
    # lives only in this container's runtime env (HOMELAB_API_TOKEN, rendered
    # in by envsubst at container start — see Dockerfile), never in the
    # bundle, never sent by the browser. Same-origin call, no CORS/CSP change.
    # No `add_header` here, so the server-block security headers above still
    # apply (Nginx only drops them in locations that set their own).
    # Upstream status codes (401/429/502/...) pass through unmodified so the
    # frontend composable can branch on them; no proxy_intercept_errors.
    location = /api/dashboard {
        proxy_pass       ${HOMELAB_API_ORIGIN}/api/dashboard;
        proxy_set_header Authorization "Bearer ${HOMELAB_API_TOKEN}";
        # $proxy_host (homelab-api's own host:port, from HOMELAB_API_ORIGIN),
        # NOT $host (the portfolio's own Host header) — forwarding the
        # portfolio's Host to homelab-api is what caused 421 Misdirected
        # Request.
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
    }

    # Cache hashed assets aggressively.
    # All security headers repeated: any add_header in a location block causes
    # Nginx to discard the server-block add_header directives for that location.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://hcaptcha.com https://*.hcaptcha.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://imgs.hcaptcha.com; frame-src https://hcaptcha.com https://*.hcaptcha.com; connect-src 'self' https://api.samueleruaro.com https://hcaptcha.com https://*.hcaptcha.com; font-src 'self'; object-src 'none'; base-uri 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
