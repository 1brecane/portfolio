# Security headers. Included by every location in site.conf: nginx drops inherited add_header
# directives in any location that sets one of its own, so they are never left to inheritance.
# The Content-Security-Policy is the one the build also writes as a <meta> tag (vite.config.ts),
# plus frame-ancestors, which only works as a header. Keep the two in step.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
